<svg xmlns="http://www.w3.org/2000/svg" width="620" height="200" viewBox="0 0 620 200" font-family="Roboto, 'Google Sans', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D0BCFF"/>
      <stop offset="1" stop-color="#4F378B"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFB8C8"/>
      <stop offset="1" stop-color="#7D5260"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CCC2DC"/>
      <stop offset="1" stop-color="#625B71"/>
    </linearGradient>
  </defs>

  <rect width="620" height="200" fill="#141218"/>

  <!-- morphing squircle: M3 expressive shape morphing via rx -->
  <rect x="56" y="52" width="96" height="96" fill="url(#s1)">
    <animate attributeName="rx" values="28;48;28" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 104 100" to="360 104 100" dur="30s" repeatCount="indefinite"/>
  </rect>

  <!-- pulsing circle with elevation ring -->
  <circle cx="248" cy="100" r="42" fill="url(#s2)">
    <animate attributeName="r" values="42;48;42" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="248" cy="100" r="42" fill="none" stroke="#EFB8C8" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="48;66;48" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating rounded triangle -->
  <path d="M 392 148 L 428 78 L 464 148 Z" fill="url(#s3)" stroke-linejoin="round" stroke="#CCC2DC" stroke-width="8">
    <animateTransform attributeName="transform" type="rotate" from="0 428 118" to="360 428 118" dur="18s" repeatCount="indefinite"/>
  </path>

  <!-- film-roll loader (M3 expressive) -->
  <rect x="524" y="62" width="56" height="76" rx="16" fill="#2B2930" stroke="#49454F"/>
  <rect x="536" y="76" width="32" height="8" rx="4" fill="#D0BCFF">
    <animate attributeName="x" values="536;548;536" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="536" y="96" width="32" height="8" rx="4" fill="#EFB8C8">
    <animate attributeName="x" values="548;536;548" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="536" y="116" width="32" height="8" rx="4" fill="#CCC2DC">
    <animate attributeName="x" values="542;552;542" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <text x="310" y="186" text-anchor="middle" font-size="14" letter-spacing="3" fill="#CAC4D0">MATERIAL 3 EXPRESSIVE</text>
</svg>

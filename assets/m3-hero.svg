<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="Roboto, 'Google Sans', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="m3primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D0BCFF"/>
      <stop offset="1" stop-color="#6750A4"/>
    </linearGradient>
    <linearGradient id="m3tertiary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFB8C8"/>
      <stop offset="1" stop-color="#7D5260"/>
    </linearGradient>
    <linearGradient id="m3secondary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CCC2DC"/>
      <stop offset="1" stop-color="#625B71"/>
    </linearGradient>
    <linearGradient id="m3bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D0BCFF"/>
      <stop offset="1" stop-color="#EFB8C8"/>
    </linearGradient>
    <clipPath id="heroClip"><rect x="60" y="52" width="880" height="216" rx="48"/></clipPath>
  </defs>

  <rect width="1000" height="320" fill="#141218"/>

  <!-- expressive tonal shapes -->
  <g clip-path="url(#heroClip)">
    <circle cx="120" cy="80" r="90" fill="url(#m3secondary)" opacity="0.20">
      <animateTransform attributeName="transform" type="translate" values="0 0;24 -14;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="250" r="110" fill="url(#m3tertiary)" opacity="0.16">
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 10;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <rect x="720" y="60" width="150" height="150" rx="60" fill="url(#m3primary)" opacity="0.14">
      <animateTransform attributeName="transform" type="rotate" from="0 795 135" to="360 795 135" dur="40s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- main surface container (M3 elevated card, radius 48) -->
  <rect x="60" y="52" width="880" height="216" rx="48" fill="#1D1B20"/>
  <rect x="60" y="52" width="880" height="216" rx="48" fill="none" stroke="#49454F" stroke-width="1.5"/>

  <!-- avatar: M3 tonal circle + person glyph -->
  <circle cx="150" cy="130" r="46" fill="#4F378B"/>
  <circle cx="150" cy="118" r="15" fill="#EADDFF"/>
  <path d="M 124 158 Q 150 134 176 158 Z" fill="#EADDFF"/>
  <circle cx="150" cy="130" r="46" fill="none" stroke="#D0BCFF" stroke-width="2" opacity="0.7">
    <animate attributeName="r" values="46;49;46" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- headline -->
  <text x="222" y="118" font-size="54" font-weight="700" fill="#E6E0E9" letter-spacing="1">BAHA</text>
  <text x="224" y="148" font-size="19" fill="#CAC4D0">Material 3 Expressive &#183; Python Developer &#183; Algeria</text>

  <!-- M3 assist chips (height 40, radius 20, outline) -->
  <g>
    <rect x="224" y="170" width="132" height="40" rx="20" fill="#2B2930" stroke="#49454F"/>
    <text x="290" y="196" text-anchor="middle" font-size="15" fill="#D0BCFF">Automation</text>

    <rect x="366" y="170" width="86" height="40" rx="20" fill="#2B2930" stroke="#49454F"/>
    <text x="409" y="196" text-anchor="middle" font-size="15" fill="#D0BCFF">APIs</text>

    <rect x="462" y="170" width="112" height="40" rx="20" fill="#2B2930" stroke="#49454F"/>
    <text x="518" y="196" text-anchor="middle" font-size="15" fill="#D0BCFF">Backend</text>

    <rect x="584" y="170" width="140" height="40" rx="20" fill="#4F378B">
      <animate attributeName="width" values="140;152;140" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <text x="654" y="196" text-anchor="middle" font-size="15" fill="#EADDFF">Open to work</text>
  </g>

  <!-- expressive loading dots -->
  <g>
    <circle cx="806" cy="86" r="9" fill="#D0BCFF">
      <animate attributeName="cy" values="86;74;86" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="86" r="9" fill="#EFB8C8">
      <animate attributeName="cy" values="86;74;86" dur="1.6s" begin="0.16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" begin="0.16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="874" cy="86" r="9" fill="#CCC2DC">
      <animate attributeName="cy" values="86;74;86" dur="1.6s" begin="0.32s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" begin="0.32s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- M3 linear progress indicator -->
  <text x="224" y="228" font-size="13" fill="#CAC4D0" letter-spacing="1">SHIPPING</text>
  <rect x="310" y="220" width="560" height="8" rx="4" fill="#36343B"/>
  <rect x="310" y="220" width="120" height="8" rx="4" fill="url(#m3bar)">
    <animate attributeName="width" values="40;420;40" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" font-family="monospace">
  <defs>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2975"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="5" y="5" width="510" height="160" rx="14" fill="#0d1117" opacity="0.97"/>
  <rect x="5" y="5" width="510" height="160" rx="14" fill="none" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
  <g stroke="#ff2975" stroke-width="3" fill="none" opacity="0.9">
    <path d="M 5 25 L 5 12 Q 5 5 12 5 L 25 5"/>
    <path d="M 495 5 L 508 5 Q 515 5 515 12 L 515 25"/>
    <path d="M 515 145 L 515 158 Q 515 165 508 165 L 495 165"/>
    <path d="M 25 165 L 12 165 Q 5 165 5 158 L 5 145"/>
  </g>

  <!-- pixel avatar -->
  <g transform="translate(30,38)">
    <rect x="-4" y="40" width="56" height="26" fill="#12123a"/>
    <rect x="-4" y="40" width="56" height="4" fill="#1f1f5c"/>
    <rect x="0" y="0" width="48" height="14" fill="#14141e"/>
    <rect x="-3" y="6" width="6" height="12" fill="#14141e"/>
    <rect x="45" y="6" width="6" height="12" fill="#14141e"/>
    <rect x="0" y="14" width="48" height="26" fill="#f2c9a0"/>
    <rect x="2" y="20" width="18" height="9" fill="#00e5ff"/>
    <rect x="26" y="20" width="18" height="9" fill="#00e5ff"/>
    <rect x="20" y="23" width="6" height="3" fill="#0d1117"/>
    <rect x="16" y="34" width="14" height="3" fill="#b5651d"/>
  </g>

  <!-- name + title -->
  <text x="110" y="56" font-size="34" font-weight="bold" fill="#ffffff" filter="url(#glow)">BAHA</text>
  <text x="110" y="78" font-size="13" letter-spacing="2" fill="#8be9fd">PYTHON DEVELOPER &#183; ALGERIA</text>

  <!-- level badge -->
  <circle cx="460" cy="50" r="32" fill="#0b0020" stroke="#ff2975" stroke-width="2"/>
  <circle cx="460" cy="50" r="25" fill="none" stroke="#ffd319" stroke-width="2" stroke-dasharray="8 5">
    <animateTransform attributeName="transform" type="rotate" from="0 460 50" to="360 460 50" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="460" y="47" text-anchor="middle" font-size="10" fill="#ffd319">LVL</text>
  <text x="460" y="66" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">24</text>

  <!-- XP bar -->
  <text x="110" y="95" font-size="11" fill="#c9d1d9">XP 7,850 / 10,000</text>
  <rect x="110" y="100" width="340" height="16" rx="8" fill="#1f2430" stroke="#30363d"/>
  <rect x="110" y="100" width="270" height="16" rx="8" fill="url(#xp)" filter="url(#glow)">
    <animate attributeName="width" values="30;270;270" keyTimes="0;0.8;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- wanted stars -->
  <text x="110" y="140" font-size="12" letter-spacing="3" fill="#ff5555">WANTED</text>
  <g fill="#ffd319" filter="url(#glow)">
    <path transform="translate(196,136)" d="M0,-8 L1.9,-2.5 L7.6,-2.5 L2.9,1 L4.5,6.5 L0,3 L-4.5,6.5 L-2.9,1 L-7.6,-2.5 L-1.9,-2.5 Z">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(222,136)" d="M0,-8 L1.9,-2.5 L7.6,-2.5 L2.9,1 L4.5,6.5 L0,3 L-4.5,6.5 L-2.9,1 L-7.6,-2.5 L-1.9,-2.5 Z">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(248,136)" d="M0,-8 L1.9,-2.5 L7.6,-2.5 L2.9,1 L4.5,6.5 L0,3 L-4.5,6.5 L-2.9,1 L-7.6,-2.5 L-1.9,-2.5 Z">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(274,136)" d="M0,-8 L1.9,-2.5 L7.6,-2.5 L2.9,1 L4.5,6.5 L0,3 L-4.5,6.5 L-2.9,1 L-7.6,-2.5 L-1.9,-2.5 Z">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(300,136)" d="M0,-8 L1.9,-2.5 L7.6,-2.5 L2.9,1 L4.5,6.5 L0,3 L-4.5,6.5 L-2.9,1 L-7.6,-2.5 L-1.9,-2.5 Z">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- stats row -->
  <text x="110" y="158" font-size="10" fill="#8b949e" letter-spacing="2">STR 99 &#183; AGI 87 &#183; INT 92 &#183; COFFEE 100</text>
</svg>

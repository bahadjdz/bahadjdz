<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" font-family="monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0020"/>
      <stop offset="1" stop-color="#1a0033"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd319"/>
      <stop offset="0.5" stop-color="#ff2975"/>
      <stop offset="1" stop-color="#8c1eff"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#0087a8"/>
    </linearGradient>
    <clipPath id="sunClip"><circle cx="400" cy="150" r="85"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="260" fill="url(#sky)"/>

  <!-- stars -->
  <circle cx="80" cy="40" r="1.5" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="70" r="1" fill="#fff"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="35" r="1.5" fill="#fff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="730" cy="80" r="1" fill="#fff"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="25" r="1" fill="#fff"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/></circle>

  <!-- sun glow + sun with scrolling stripes -->
  <circle cx="400" cy="150" r="100" fill="url(#sun)" opacity="0.22" filter="url(#glow)"/>
  <circle cx="400" cy="150" r="85" fill="url(#sun)"/>
  <g clip-path="url(#sunClip)" fill="#0b0020" opacity="0.92">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 16" dur="2.6s" repeatCount="indefinite"/>
      <rect x="300" y="118" width="200" height="6"/>
      <rect x="300" y="134" width="200" height="7"/>
      <rect x="300" y="152" width="200" height="8"/>
      <rect x="300" y="172" width="200" height="9"/>
      <rect x="300" y="194" width="200" height="10"/>
      <rect x="300" y="218" width="200" height="11"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -16;0 0" dur="2.6s" repeatCount="indefinite"/>
      <rect x="300" y="118" width="200" height="6"/>
      <rect x="300" y="134" width="200" height="7"/>
      <rect x="300" y="152" width="200" height="8"/>
      <rect x="300" y="172" width="200" height="9"/>
      <rect x="300" y="194" width="200" height="10"/>
      <rect x="300" y="218" width="200" height="11"/>
    </g>
  </g>

  <!-- neon title with glitch ghosts -->
  <text x="396" y="90" text-anchor="middle" font-size="44" font-weight="bold" letter-spacing="6" fill="#00e5ff" opacity="0">
    GRAND THEFT CODE
    <animate attributeName="opacity" values="0;0;0.8;0;0;0.8;0" keyTimes="0;0.40;0.43;0.47;0.71;0.74;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="404" y="92" text-anchor="middle" font-size="44" font-weight="bold" letter-spacing="6" fill="#ff2975" opacity="0">
    GRAND THEFT CODE
    <animate attributeName="opacity" values="0;0;0.8;0;0;0.8;0" keyTimes="0;0.44;0.47;0.51;0.79;0.82;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="90" text-anchor="middle" font-size="44" font-weight="bold" letter-spacing="6" fill="#ffffff" filter="url(#glow)">GRAND THEFT CODE</text>
  <text x="400" y="116" text-anchor="middle" font-size="15" letter-spacing="5" fill="#00e5ff" opacity="0.9">— BAHA EDITION —</text>

  <!-- press start -->
  <text x="400" y="140" text-anchor="middle" font-size="13" letter-spacing="4" fill="#ffd319">
    PRESS START
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.3s" repeatCount="indefinite"/>
  </text>

  <!-- grid floor -->
  <g stroke="#ff2975" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="4s" repeatCount="indefinite"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="233" x2="800" y2="233"/>
    <line x1="0" y1="248" x2="800" y2="248"/>
    <line x1="400" y1="205" x2="-200" y2="260"/>
    <line x1="400" y1="205" x2="0" y2="260"/>
    <line x1="400" y1="205" x2="200" y2="260"/>
    <line x1="400" y1="205" x2="400" y2="260"/>
    <line x1="400" y1="205" x2="600" y2="260"/>
    <line x1="400" y1="205" x2="800" y2="260"/>
    <line x1="400" y1="205" x2="1000" y2="260"/>
  </g>

  <!-- skyline -->
  <g fill="#050010">
    <rect x="0" y="185" width="70" height="75"/>
    <rect x="60" y="200" width="50" height="60"/>
    <rect x="105" y="178" width="60" height="82"/>
    <rect x="160" y="205" width="45" height="55"/>
    <rect x="200" y="190" width="65" height="70"/>
    <rect x="540" y="195" width="55" height="65"/>
    <rect x="590" y="180" width="60" height="80"/>
    <rect x="645" y="205" width="45" height="55"/>
    <rect x="685" y="188" width="60" height="72"/>
    <rect x="740" y="200" width="60" height="60"/>
    <rect x="128" y="160" width="4" height="20"/>
    <rect x="612" y="158" width="4" height="24"/>
  </g>
  <!-- windows -->
  <g fill="#ffd319">
    <rect x="20" y="196" width="4" height="5"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="34" y="212" width="4" height="5"/>
    <rect x="120" y="190" width="4" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="140" y="205" width="4" height="5"/>
    <rect x="220" y="200" width="4" height="5"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="608" y="192" width="4" height="5"/>
    <rect x="700" y="198" width="4" height="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="716" y="212" width="4" height="5"/>
  </g>

  <!-- moving car -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="-160 200;960 200" dur="7s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="90" height="18" rx="4" fill="url(#car)"/>
    <rect x="18" y="-13" width="42" height="14" rx="3" fill="#0087a8"/>
    <rect x="24" y="-10" width="12" height="8" fill="#dffcff"/>
    <rect x="42" y="-10" width="12" height="8" fill="#dffcff"/>
    <circle cx="20" cy="20" r="8" fill="#111" stroke="#00e5ff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72" cy="20" r="8" fill="#111" stroke="#00e5ff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 72 20" to="360 72 20" dur="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- scanlines -->
  <g fill="#000" opacity="0.10">
    <rect x="0" y="8" width="800" height="1"/>
    <rect x="0" y="16" width="800" height="1"/>
    <rect x="0" y="24" width="800" height="1"/>
    <rect x="0" y="32" width="800" height="1"/>
    <rect x="0" y="40" width="800" height="1"/>
    <rect x="0" y="48" width="800" height="1"/>
    <rect x="0" y="56" width="800" height="1"/>
    <rect x="0" y="64" width="800" height="1"/>
    <rect x="0" y="72" width="800" height="1"/>
    <rect x="0" y="80" width="800" height="1"/>
    <rect x="0" y="88" width="800" height="1"/>
    <rect x="0" y="96" width="800" height="1"/>
    <rect x="0" y="104" width="800" height="1"/>
    <rect x="0" y="112" width="800" height="1"/>
    <rect x="0" y="120" width="800" height="1"/>
    <rect x="0" y="128" width="800" height="1"/>
    <rect x="0" y="136" width="800" height="1"/>
    <rect x="0" y="144" width="800" height="1"/>
    <rect x="0" y="152" width="800" height="1"/>
    <rect x="0" y="160" width="800" height="1"/>
    <rect x="0" y="168" width="800" height="1"/>
    <rect x="0" y="176" width="800" height="1"/>
    <rect x="0" y="184" width="800" height="1"/>
    <rect x="0" y="192" width="800" height="1"/>
    <rect x="0" y="200" width="800" height="1"/>
    <rect x="0" y="208" width="800" height="1"/>
    <rect x="0" y="216" width="800" height="1"/>
    <rect x="0" y="224" width="800" height="1"/>
    <rect x="0" y="232" width="800" height="1"/>
    <rect x="0" y="240" width="800" height="1"/>
    <rect x="0" y="248" width="800" height="1"/>
    <rect x="0" y="256" width="800" height="1"/>
  </g>
</svg>
